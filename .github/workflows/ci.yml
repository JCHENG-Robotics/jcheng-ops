name: ops-ci

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ops-gate:
    name: ops-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install test dependencies
        run: python3 -m pip install --quiet 'pytest==8.3.4'
      - name: Repository gate
        shell: bash
        run: bash scripts/check_repo_gate.sh
